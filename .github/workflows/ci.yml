name: LICOGI CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: licogi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://licogi:licogi@localhost:5432/licogi_ci?schema=public
      NEXT_PUBLIC_SITE_URL: https://ci.example.invalid
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: licogi_ci
          POSTGRES_USER: licogi
          POSTGRES_PASSWORD: licogi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licogi -d licogi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint and typecheck
        run: pnpm run check

      - name: Build production bundle
        run: pnpm run build

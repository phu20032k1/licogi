      <text x="620" y="735" fill="#475569" font-size="16" font-weight="700">Nguyễn Ánh Quang · Nhà ăn · Bể ngầm · Bể XLNT</text>
      <text x="620" y="787" fill="#047857" font-size="34" font-weight="900">83,4%</text>
      <text x="760" y="785" fill="#64748b" font-size="16" font-weight="700">38/44 đài móng · dầm 30% · cột 30%</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1208" y="648" width="308" height="170" rx="28" fill="#ffffff"/>
      <rect x="1208" y="648" width="308" height="12" rx="6" fill="#94a3b8"/>
      <text x="1238" y="700" fill="#0f172a" font-size="23" font-weight="900">HẠ TẦNG</text>
      <text x="1238" y="735" fill="#475569" font-size="16" font-weight="700">Nguyễn Duy Thọ</text>
      <text x="1238" y="780" fill="#64748b" font-size="18" font-weight="800">Chưa xác nhận %</text>
    </g>

    <g>
      <circle cx="88" cy="846" r="6" fill="#10b981"/><text x="104" y="852" fill="#cbd5e1" font-size="14" font-weight="600">Đạt cao</text>
      <circle cx="210" cy="846" r="6" fill="#f59e0b"/><text x="226" y="852" fill="#cbd5e1" font-size="14" font-weight="600">Cần bám mốc</text>

      <rect x="82" y="476" width="470" height="14" rx="7" fill="#ef4444"/>
      <text x="114" y="532" fill="#0f172a" font-size="25" font-weight="900">XƯỞNG 3</text>
      <rect x="114" y="558" width="180" height="154" rx="20" fill="url(#red)" stroke="#fb7185" stroke-opacity=".55"/>
      <text x="134" y="592" fill="#9f1239" font-size="15" font-weight="800">NGUYỄN ÁNH QUANG</text><text x="134" y="652" fill="#be123c" font-size="46" font-weight="900">0%</text><text x="134" y="684" fill="#64748b" font-size="14" font-weight="700">1/2 Xưởng 3</text>
      <rect x="314" y="558" width="206" height="154" rx="20" fill="url(#red)" stroke="#fb7185" stroke-opacity=".55"/>
      <text x="334" y="592" fill="#9f1239" font-size="15" font-weight="800">NGUYỄN DUY THỌ</text><text x="334" y="652" fill="#be123c" font-size="46" font-weight="900">0%</text><text x="334" y="684" fill="#64748b" font-size="14" font-weight="700">1/2 Xưởng 3</text>
    </g>

    <g filter="url(#shadow)">

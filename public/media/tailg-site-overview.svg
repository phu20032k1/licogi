        <text x="646" y="352" fill="#92400e" font-size="16" font-weight="800">TRẦN VĂN TOÃN</text><text x="646" y="402" fill="#b45309" font-size="40" font-weight="900">85%</text>
        <rect x="1068" y="316" width="416" height="124" rx="20" fill="url(#amber)" stroke="#f59e0b" stroke-opacity=".45"/>
        <text x="1094" y="352" fill="#92400e" font-size="16" font-weight="800">NGUYỄN VĂN TUẦN</text><text x="1094" y="402" fill="#b45309" font-size="40" font-weight="900">85%</text>
        <rect x="620" y="460" width="416" height="124" rx="20" fill="url(#green)" stroke="#10b981" stroke-opacity=".45"/>
        <text x="646" y="496" fill="#065f46" font-size="16" font-weight="800">BÙI VĂN ĐỨC</text><text x="646" y="546" fill="#047857" font-size="40" font-weight="900">92%</text>
        <rect x="1068" y="460" width="416" height="124" rx="20" fill="url(#green)" stroke="#10b981" stroke-opacity=".45"/>
        <text x="1094" y="496" fill="#065f46" font-size="16" font-weight="800">TĂNG VĂN TOÁN</text><text x="1094" y="546" fill="#047857" font-size="40" font-weight="900">92%</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ trực quan dự án Nhà máy TAILG</title>
  <desc id="desc">Sơ đồ phân khu Xưởng 1, Xưởng 2, Xưởng 3, nhà xe, khu phụ trợ và hạ tầng theo 6 đội thi công.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061322"/>
      <stop offset="0.58" stop-color="#0a2f59"/>
      <stop offset="1" stop-color="#0d2138"/>
    </linearGradient>
    <linearGradient id="x1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef6ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfdf5"/><stop offset="1" stop-color="#d1fae5"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffbeb"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1f2"/><stop offset="1" stop-color="#ffe4e6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".24"/></filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  </defs>

  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="42" fill="url(#grid)"/>

  <g font-family="Be Vietnam Pro, Arial, sans-serif">

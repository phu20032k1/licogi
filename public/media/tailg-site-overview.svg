    <text x="82" y="169" fill="#cbd5e1" font-size="20" font-weight="500">Snapshot 05/09/2026 · 6 đội thi công · theo phân công đã xác nhận</text>

    <g filter="url(#shadow)">
      <rect x="82" y="230" width="470" height="210" rx="28" fill="#ffffff"/>
      <rect x="82" y="230" width="470" height="14" rx="7" fill="#38bdf8"/>
      <text x="114" y="284" fill="#0f172a" font-size="25" font-weight="800">XƯỞNG 2</text>
      <text x="114" y="319" fill="#475569" font-size="18" font-weight="600">Bùi Văn Đức</text>
      <text x="114" y="383" fill="#0369a1" font-size="54" font-weight="900">15%</text>
      <text x="278" y="380" fill="#64748b" font-size="18" font-weight="600">Móng / ép cọc</text>
      <rect x="114" y="404" width="370" height="10" rx="5" fill="#e2e8f0"/><rect x="114" y="404" width="56" height="10" rx="5" fill="#0ea5e9"/>
